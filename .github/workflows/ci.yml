name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: TESTING BACKEND
  # ─────────────────────────────────────────
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: tododb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tododb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Database
        env:
          PGPASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        run: |
          until pg_isready -h 127.0.0.1 -p 5432 -U postgres -d tododb; do
            echo "Waiting for Postgres to open TCP connections..."
            sleep 2
          done

          psql -h 127.0.0.1 -p 5432 -U postgres -d tododb -f ./database/database.sql

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: cd backend && npm ci

      - name: Run Tests
        env:
          DB_USER: postgres
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: tododb
          NODE_ENV: test
        run: cd backend && npm test

  # ─────────────────────────────────────────
  # JOB 2: BUILD & PUSH DOCKER IMAGES
  # ─────────────────────────────────────────
  build-and-push:
    name: Build and Push Images
    needs: test # phải chạy qua test 
    runs-on: ubuntu-latest

    # Chỉ chạy khi merge vào main, không chạy khi mở PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend-cos1203:1.0

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend-cos1203:1.0
