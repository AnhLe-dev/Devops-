services:
  # ─────────────────────────────────────────
  # FRONTEND SERVICE
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-anhle}/devops-frontend-cos1203:1.0
    container_name: devops-frontend-cos1203
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ─────────────────────────────────────────
  # BACKEND SERVICE
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${DOCKERHUB_USERNAME:-anhle}/devops-backend-cos1203:1.0
    container_name: devops-backend-cos1203
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: tododb
      DB_USER: postgres
      DB_PASSWORD: 123456789
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────
  # POSTGRES SERVICE
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: devops-postgres-cos1203
    restart: always
    environment:
      POSTGRES_DB: tododb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tododb']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
